name: CI

on:
  push:
    tags: ['*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # GitHub-hosted macOS runner. CoreBluetooth 를 쓰므로 Linux 에서는 돌지 않는다. macOS job 하나만 둔다
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 이 저장소에는 계약 폴더가 없다. 계약 폴더를 읽는 시험은 "계약 폴더 없음" 으로 건너뛰고, 나머지 시험은 돈다
      - name: Test
        run: swift test
