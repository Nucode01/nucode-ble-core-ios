# Azure(메인) 의 main 과 태그를 GitHub 미러로 옮긴다. 사람은 Azure 에만 push 한다
# 미러의 태그 push 가 GitHub Actions CI(.github/workflows/ci.yml)를 돌린다
trigger:
  # 실행 중에 같은 ref 로 온 push 는 모아서 다음 실행 하나로 옮긴다. main 과 태그는 ref 가 달라 실행이 둘 돌 수 있다
  batch: true
  branches:
    include: [main]
  tags:
    include: ['*']

pr: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
    fetchTags: true
    persistCredentials: false

  # --mirror · --force 는 쓰지 않는다. 미러의 ref 를 지우거나 덮어쓰지 않고, 이력이 갈라지면 실패로 드러낸다
  # 토큰은 비밀 변수 GITHUB_MIRROR_TOKEN 을 env 로만 받는다. 원격 URL 을 git config 에 남기지 않는다
  - bash: |
      set -eu
      set +x
      git push "https://x-access-token:${MIRROR_TOKEN}@github.com/Nucode01/nucode-ble-core-ios.git" \
        "refs/remotes/origin/main:refs/heads/main" "refs/tags/*:refs/tags/*"
    displayName: Push main and tags to GitHub mirror
    env:
      MIRROR_TOKEN: $(GITHUB_MIRROR_TOKEN)
